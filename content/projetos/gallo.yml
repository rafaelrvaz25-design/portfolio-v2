titulo_pagina: "Gallo: uma nova identidade, uma nova experiência digital"
ano: "2026"
ficha:
  papel: UX/UI Designer
  cliente: Gallo
  setor: Alimentação
capa:
  imagem: /images/gallo/00-capa.webp?v=2
  cor_fundo: "#e2c879"
secoes:
  - titulo: O desafio
    subtitulo: Uma nova identidade para contar uma nova história.
    blocos:
      - tipo: texto
        corpo: >-
          Em 2026, a Gallo, marca portuguesa de azeite fundada em 1919, relançou
          a sua identidade com uma nova linguagem visual, inspirada no sol da
          manhã e no canto do galo, e uma nova garrafa. A landing page tinha de
          apresentar essa evolução, das origens à nova imagem, seguindo as
          orientações de comunicação do cliente.


          A identidade já estava definida no brandbook. O meu trabalho foi **levá-la para o digital**, das fundações no Figma aos ecrãs desktop e mobile, à adaptação para os dois mercados, aos protótipos e ao handoff.


          O equilíbrio estava entre expressão criativa, clareza de leitura e consistência entre os mercados brasileiro e português.
      - tipo: figura
        imagem: /images/gallo/01-identidade.webp?v=1
        imagem_mobile: /images/gallo/01-identidade-mobile.webp?v=1
        legenda: A identidade definida no brandbook e a forma como foi aplicada na
          landing page.
  - titulo: Exploração visual
    subtitulo: Da identidade à interface.
    blocos:
      - tipo: texto
        corpo: >-
          Comecei por organizar as fundações no Figma: cores em dois modos, um
          para cada mercado, escala tipográfica, grelha e os assets da marca.
          Seguiram-se os wireframes, com a estrutura e as primeiras hipóteses de
          conteúdo.


          Em alta fidelidade, explorei várias formas de aplicar a identidade. A meio do processo, o cliente enviou PDFs com a estrutura e os textos que queria na página. Uma versão que os seguia à letra ficou só como referência. Ficou decidido que **a estrutura e os textos seriam os do cliente e a linguagem visual seria a da exploração mais expressiva**: tipografia grande, combinações de cor do brandbook e a garrafa como protagonista.
      - tipo: figura
        imagem: /images/gallo/02-processo.webp?v=1
        imagem_mobile: /images/gallo/02-processo-mobile.webp?v=1
        legenda: "Três momentos do processo: fundações, estrutura e propostas em alta
          fidelidade."
  - titulo: Uma história contada através das garrafas
    subtitulo: Encontrar a melhor forma de apresentar a evolução.
    blocos:
      - tipo: texto
        corpo: >-
          A decisão de design mais relevante foi a forma de mostrar as
          embalagens Gallo de 1919 a 2026: uma sequência de garrafas tinha de se
          tornar um elemento apelativo, sem complicar a navegação.


          Na versão apresentada ao cliente a 16 de outubro, as garrafas estavam num **carrossel com setas**. O cliente queria vê-las todas de uma vez, sem andar para o lado. Antes de redesenhar, analisei padrões de timelines: soluções com scroll horizontal ou que alteram o scroll da página dificultam a leitura.


          Explorei várias alternativas, entre elas uma prateleira que se enchia à medida que se avançava e propostas mais criativas. Na segunda ronda de feedback, a prateleira foi considerada demasiado simples e as propostas criativas excessivas, e o cliente pediu a ordem cronológica invertida.
      - tipo: figura
        imagem: /images/gallo/03a-timeline-exploracao.webp?v=1
        imagem_mobile: /images/gallo/03a-timeline-exploracao-mobile.webp?v=1
        legenda: As explorações da timeline, antes da solução final. Nenhuma foi
          implementada.
      - tipo: texto
        corpo: A solução final reúne **todas as garrafas na mesma base**, de 2026 a
          1919, com a garrafa escolhida em destaque, em grande e sobre o sol. A
          seleção muda com o cursor, o foco do teclado ou um toque, e a evolução
          lê-se de imediato, sem scroll horizontal.
      - tipo: figura
        imagem: /images/gallo/03b-timeline-final.webp?v=1
        imagem_mobile: /images/gallo/03b-timeline-final-mobile.webp?v=1
        legenda: A solução aprovada em desktop e mobile.
  - titulo: Uma experiência, dois mercados
    subtitulo: Consistência com espaço para adaptação.
    blocos:
      - tipo: texto
        corpo: A landing page foi desenhada primeiro para o Brasil e depois adaptada a
          Portugal. Como as fundações tinham um modo de cor para cada mercado,
          os componentes foram reutilizados sem duplicar o trabalho. O Brasil
          usa o verde como cor dominante e Portugal o azul, seguindo as
          orientações da identidade. Mudaram também o título, a sequência de
          embalagens na timeline e a gama de produtos.
      - tipo: figura
        imagem: /images/gallo/04-mercados.webp?v=1
        imagem_mobile: /images/gallo/04-mercados-mobile.webp?v=1
        legenda: As versões finais do Brasil e de Portugal nos mesmos pontos da página.
  - titulo: Resultado final
    subtitulo: Uma nova imagem, do conceito à entrega.
    blocos:
      - tipo: figura
        imagem: /images/gallo/05a-pagina-final.webp?v=1
        imagem_mobile: /images/gallo/05a-pagina-final-mobile.webp?v=1
        legenda: A versão final aprovada para o Brasil, em desktop, de cima a baixo.
      - tipo: texto
        corpo: Na secção da nova garrafa, a pedido do cliente, a imagem aproxima-se de
          cada detalhe à medida que se faz scroll. Desenhei os três estados, em
          desktop e mobile, e prototipei a transição.
      - tipo: figura
        imagem: /images/gallo/05b-detalhes.webp?v=1
        imagem_mobile: /images/gallo/05b-detalhes-mobile.webp?v=1
        legenda: Os três detalhes da nova garrafa, um por cada passo do scroll.
      - tipo: figura
        imagem: /images/gallo/05c-mobile.webp?v=1
        imagem_mobile: /images/gallo/05c-mobile-mobile.webp?v=1
        legenda: Ecrãs mobile das versões do Brasil e de Portugal.
      - tipo: texto
        corpo: >-
          No fim, o cliente aprovou as versões desktop e mobile para o Brasil e
          para Portugal. Entreguei os protótipos e o handoff para
          desenvolvimento.


          A versão brasileira foi implementada e está publicada em [galloportugal.com/pt-br/nova-imagem](https://www.galloportugal.com/pt-br/nova-imagem/). Depois da entrega, a implementação recebeu alterações que não fizeram parte do design aprovado, por isso este case study mostra os ecrãs finais do Figma.
  - titulo: Aprendizagens
    blocos:
      - tipo: texto
        corpo: "Este projeto mostrou-me como o feedback do cliente pode melhorar uma
          decisão: o carrossel que apresentei escondia a ideia principal, e só
          com todas as garrafas visíveis a evolução da marca se lê de imediato.
          Preparar um modo de cor por mercado logo nas fundações fez da versão
          portuguesa uma adaptação, e não um segundo projeto. E aceitar a
          estrutura e os textos do cliente, mantendo a linguagem visual mais
          expressiva, foi a forma de equilibrar a direção criativa com os
          requisitos do negócio."
