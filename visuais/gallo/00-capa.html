<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- no-mobile: a capa usa a mesma imagem em todos os ecrãs -->
<style>
#fig{width:1600px;height:900px;position:relative;overflow:hidden;background:#F8F2D8}
.win{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(35,46,10,.22),0 4px 14px rgba(35,46,10,.10)}
.win img{width:100%;display:block}
.bar{height:28px;background:#fff;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #eee}
.bar i{width:10px;height:10px;border-radius:50%;background:#e2e2e2}
.pt{left:90px;top:70px;width:900px;height:628px}
.br{left:610px;top:262px;width:900px;height:628px;border-bottom-left-radius:14px}
.ph{position:absolute;left:1150px;top:250px;width:280px;height:606px;border-radius:30px;overflow:hidden;border:6px solid #fff;box-shadow:0 30px 80px rgba(35,46,10,.25)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body><div id="fig">
  <div class="win pt"><div class="bar"><i></i><i></i><i></i></div><img src="crops/pt-d-hero.jpg"></div>
  <div class="win br"><div class="bar"><i></i><i></i><i></i></div><img src="crops/br-d-hero.jpg"></div>
</div></body></html>
