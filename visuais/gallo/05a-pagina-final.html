<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
.panel{padding:14px}
.panel img{width:100%;border-radius:4px}
body.m .cols{grid-template-columns:1fr;gap:0}
body.m .panel{border-radius:0;border-top:none;border-bottom:none}
body.m .cols>.panel:first-child{border-radius:12px 12px 0 0;border-top:1px solid #DADADA;padding-bottom:0}
body.m .cols>.panel:nth-child(2){padding-top:0;padding-bottom:0}
body.m .cols>.panel:last-child{border-radius:0 0 12px 12px;border-bottom:1px solid #DADADA;padding-top:0}
body.m .panel img{border-radius:0}
</style></head><body><div id="fig">
<div class="cols">
  <div class="panel"><img src="crops/br-d-part1.jpg"></div>
  <div class="panel"><img src="crops/br-d-part2.jpg"></div>
  <div class="panel"><img src="crops/br-d-part3.jpg"></div>
</div>
</div></body></html>
