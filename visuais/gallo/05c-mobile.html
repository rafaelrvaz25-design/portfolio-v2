</style></head><body><div id="fig">

    <div class="ph"><img src="crops/br-m-emb.jpg"></div></div></div>
  <div class="panel"><p class="kick k">Portugal · mobile 390</p><div class="phones">
    <div class="ph"><img src="crops/pt-m-evo.jpg"></div>
    <div class="ph"><img src="crops/pt-m-nova.jpg"></div>
    <div class="ph"><img src="crops/pt-m-emb.jpg"></div></div></div>
</div>
</div></body></html>
